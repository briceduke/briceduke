<!DOCTYPE html>
<html lang="en" data-theme="night-studio">
{{- partial "head.html" . -}}
<body class="stage-shell{{ if .IsHome }} is-home{{ end }}">
    <a class="skip-link" href="#main">Skip to content</a>
    {{ if .IsHome }}
        {{- partial "splash.html" . -}}
    {{ end }}
    <div class="stage">
        {{- partial "orb-nav.html" . -}}
        {{- partial "ticker.html" . -}}
        <main id="main" tabindex="-1">
            {{- block "main" . }}{{- end }}
        </main>
        {{- partial "footer.html" . -}}
    </div>
    <div id="imageModal" class="modal" hidden>
        <button type="button" class="close" aria-label="Close image">×</button>
        <img class="modal-content" id="modalImage" alt="">
    </div>
    {{ $js := resources.Get "js/stage.js" }}
    <script src="{{ $js.RelPermalink }}" defer></script>
</body>
</html>
